name: Agent C temporary Chromium browser smoke

on:
  push:
    branches:
      - agent/ui
    paths:
      - .github/workflows/agent-ui-browser-smoke.yml

permissions:
  contents: read

jobs:
  browser-acceptance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Display exact runtime versions
        run: node --version && npm --version
      - name: Install production packages only from committed lockfile
        working-directory: app
        run: npm ci --no-audit --no-fund
      - name: Install ephemeral browser driver without changing package manifest
        working-directory: app
        run: npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.56.1
      - name: Install Chromium and runner libraries
        working-directory: app
        run: npx playwright install --with-deps chromium
      - name: Start local Vite dev server
        working-directory: app
        run: |
          nohup npm run dev -- --host 127.0.0.1 --port 5173 --strictPort >/tmp/round4k-vite.log 2>&1 &
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/round4k-vite.log
          exit 1
      - name: Actual browser smoke (A-D, Advanced, Compare, invalid input)
        working-directory: app
        run: node tests/round4k-browser-smoke.mjs
      - name: Upload browser evidence even if a check fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-c-round4k-browser-evidence
          path: |
            app/browser-evidence/
            /tmp/round4k-vite.log
          if-no-files-found: warn
          retention-days: 14
