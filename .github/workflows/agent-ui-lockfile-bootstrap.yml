name: Agent C temporary lockfile bootstrap

on:
  push:
    branches:
      - agent/ui
    paths:
      - .github/workflows/agent-ui-lockfile-bootstrap.yml

permissions:
  contents: write

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate lockfile for existing package manifest
        working-directory: app
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Prove clean locked install
        working-directory: app
        run: npm ci --no-audit --no-fund

      - name: Test
        working-directory: app
        run: npm test

      - name: Typecheck and build
        working-directory: app
        run: npm run build

      - name: Commit only validated lockfile to agent/ui
        run: |
          test -f app/package-lock.json
          git add -- app/package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile change"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "build(ui): lock Node 22 dependencies after clean CI"
          git push origin HEAD:agent/ui
