<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">Scenario D simple Explorer prototype</title>
<desc id="desc">At simulation time 4.5 seconds six asynchronous paths are summarized without invented actor state. One path is complete, one classical continuation has resumed, quantum task three is running, quantum task four is resource queued, and quantum tasks five and six are policy held. The logical authored workflow uses multiplicity six for each stage and there is no global synchronization.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475467"/></marker></defs>
<style>
text{font-family:Inter,Arial,sans-serif;fill:#18202b}.h1{font-size:28px;font-weight:750}.h2{font-size:19px;font-weight:700}.h3{font-size:15px;font-weight:700}.body{font-size:14px}.small{font-size:12px;fill:#667085}.tiny{font-size:11px;font-weight:650}.panel{fill:#fff;stroke:#d0d5dd;stroke-width:1.5}.banner{fill:#eef4ff;stroke:#175cd3;stroke-width:1.5}.run{fill:#d9f2e3;stroke:#2f855a}.queue{fill:#eee5ff;stroke:#6b46c1}.held{fill:#fff0d5;stroke:#b54708;stroke-dasharray:6 4}.done{fill:#f2f4f7;stroke:#667085}.node{fill:#fff;stroke:#98a2b3;stroke-width:1.5}.node-active{fill:#f4f0ff;stroke:#6b46c1;stroke-width:2}.badge{fill:#344054}.badgeText{fill:#fff;font-size:13px;font-weight:750}.chip{fill:#f2f4f7;stroke:#d0d5dd}.control{fill:#fff;stroke:#98a2b3}.primary{fill:#175cd3;stroke:#175cd3}.primaryText{fill:#fff;font-size:13px;font-weight:700}.edge{stroke:#475467;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
</style>
<rect width="1440" height="900" fill="#f6f7f9"/>
<text x="44" y="48" class="h1">Scenario D · throughput-limited asynchronous workflow</text>
<text x="44" y="72" class="small">Simple default Explorer · compact logical paths · synthetic acceptance fixture</text>
<rect x="1172" y="28" width="224" height="44" rx="11" class="control"/><text x="1284" y="55" class="h3" text-anchor="middle">Advanced / Diagnostics</text>

<rect x="44" y="96" width="1352" height="78" rx="14" class="banner"/>
<text x="64" y="122" class="tiny" fill="#175cd3">WHAT IS HAPPENING NOW?</text>
<text x="64" y="151" class="h2">ASYNC PIPELINE — QPU saturated; completed paths resume independently · no global sync</text>
<rect x="1132" y="111" width="244" height="46" rx="10" fill="#fff" stroke="#d0d5dd"/>
<text x="1150" y="129" class="small">simulation time</text><text x="1150" y="151" class="h3">4.5 s / 13.0 s</text>

<rect x="44" y="196" width="760" height="230" rx="14" class="panel"/>
<text x="64" y="226" class="h2">6 asynchronous paths</text>
<text x="64" y="248" class="small">Actor state is not authored here — show path/system progress instead</text>
<rect x="64" y="270" width="136" height="72" rx="10" class="done"/><text x="82" y="294" class="small">Complete</text><text x="182" y="328" class="h1" text-anchor="end">1</text>
<rect x="210" y="270" width="136" height="72" rx="10" class="run"/><text x="228" y="294" class="small">Classical resumed</text><text x="328" y="328" class="h1" text-anchor="end">1</text>
<rect x="356" y="270" width="136" height="72" rx="10" class="run"/><text x="374" y="294" class="small">QPU running</text><text x="474" y="328" class="h1" text-anchor="end">1</text>
<rect x="502" y="270" width="136" height="72" rx="10" class="queue"/><text x="520" y="294" class="small">Resource queued</text><text x="620" y="328" class="h1" text-anchor="end">1</text>
<rect x="648" y="270" width="136" height="72" rx="10" class="held"/><text x="666" y="294" class="small">Policy held</text><text x="766" y="328" class="h1" text-anchor="end">2</text>
<text x="64" y="376" class="h3">Path partition</text>
<text x="64" y="401" class="body">1 complete · 1 resumed classical · 1 QPU running · 1 resource queued · 2 policy held = 6 paths</text>

<rect x="824" y="196" width="572" height="230" rx="14" class="panel"/>
<text x="844" y="226" class="h2">Quantum bottleneck</text>
<text x="844" y="248" class="small">Resource queue and admission policy remain separate</text>
<rect x="844" y="270" width="170" height="64" rx="10" class="run"/><text x="860" y="294" class="small">Running</text><text x="998" y="320" class="h2" text-anchor="end">q3</text>
<rect x="1024" y="270" width="170" height="64" rx="10" class="queue"/><text x="1040" y="294" class="small">Resource queue</text><text x="1178" y="320" class="h2" text-anchor="end">q4 · 1</text>
<rect x="1204" y="270" width="168" height="64" rx="10" class="held"/><text x="1220" y="294" class="small">Policy held</text><text x="1356" y="320" class="h2" text-anchor="end">q5–q6 · 2</text>
<rect x="844" y="354" width="328" height="44" rx="9" class="chip"/><text x="858" y="373" class="small">CPU allocation</text><text x="1156" y="387" class="h3" text-anchor="end">1 active · 5 released</text>
<rect x="1182" y="354" width="190" height="44" rx="9" fill="#ecfdf3" stroke="#2f855a"/><text x="1277" y="381" class="tiny" text-anchor="middle">NO GLOBAL SYNC</text>

<rect x="44" y="450" width="1352" height="292" rx="14" class="panel"/>
<text x="64" y="480" class="h2">Logical authored workflow</text>
<text x="64" y="502" class="small">Compact multiplicity · playback updates state counts, not node geometry</text>

<rect x="92" y="552" width="310" height="132" rx="12" class="node"/>
<text x="112" y="583" class="h2">Preparation</text><rect x="334" y="566" width="48" height="28" rx="14" class="badge"/><text x="358" y="585" class="badgeText" text-anchor="middle">×6</text>
<rect x="112" y="606" width="126" height="28" rx="14" class="done"/><text x="175" y="625" class="tiny" text-anchor="middle">6 COMPLETE</text>
<rect x="112" y="646" width="270" height="26" rx="7" class="chip"/><text x="126" y="664" class="tiny">CPU</text><text x="368" y="664" class="tiny" text-anchor="end">1 unit / instance</text>

<rect x="565" y="552" width="310" height="132" rx="12" class="node-active"/>
<text x="585" y="583" class="h2">Quantum evaluation</text><rect x="807" y="566" width="48" height="28" rx="14" class="badge"/><text x="831" y="585" class="badgeText" text-anchor="middle">×6</text>
<text x="585" y="619" class="tiny">done 2 · RUN 1 · queue 1 · held 2</text>
<rect x="585" y="646" width="270" height="26" rx="7" class="chip"/><text x="599" y="664" class="tiny">QPU</text><text x="841" y="664" class="tiny" text-anchor="end">1 unit / instance</text>

<rect x="1038" y="552" width="310" height="132" rx="12" class="node"/>
<text x="1058" y="583" class="h2">Classical continuation</text><rect x="1280" y="566" width="48" height="28" rx="14" class="badge"/><text x="1304" y="585" class="badgeText" text-anchor="middle">×6</text>
<text x="1058" y="619" class="tiny">1 complete · 1 RUN · 4 waiting locally</text>
<rect x="1058" y="646" width="270" height="26" rx="7" class="chip"/><text x="1072" y="664" class="tiny">CPU</text><text x="1314" y="664" class="tiny" text-anchor="end">1 unit / instance</text>
<path d="M402 618H565M875 618H1038" class="edge"/>
<rect x="900" y="520" width="122" height="28" rx="14" fill="#ecfdf3" stroke="#2f855a"/><text x="961" y="539" class="tiny" text-anchor="middle">LOCAL RELEASE</text>

<rect x="44" y="766" width="1352" height="104" rx="14" class="panel"/>
<text x="64" y="795" class="h3">Playback</text>
<rect x="160" y="782" width="92" height="36" rx="9" class="control"/><text x="206" y="805" class="tiny" text-anchor="middle">Previous</text>
<rect x="262" y="782" width="92" height="36" rx="9" class="primary"/><text x="308" y="805" class="primaryText" text-anchor="middle">Play</text>
<rect x="364" y="782" width="92" height="36" rx="9" class="control"/><text x="410" y="805" class="tiny" text-anchor="middle">Next</text>
<text x="486" y="805" class="body">QPU service cycle · path 2 resumed · next work admitted</text>
<line x1="160" y1="842" x2="1328" y2="842" stroke="#d0d5dd" stroke-width="8" stroke-linecap="round"/><line x1="160" y1="842" x2="564" y2="842" stroke="#175cd3" stroke-width="8" stroke-linecap="round"/><circle cx="564" cy="842" r="11" fill="#fff" stroke="#175cd3" stroke-width="3"/>
<text x="160" y="862" class="small">0 s</text><text x="564" y="862" class="tiny" text-anchor="middle">4.5 s</text><text x="1328" y="862" class="small" text-anchor="end">13.0 s</text>
</svg>