<text x="62" y="507" class="t">P3</text><rect x="118" y="490" width="150" height="22" rx="5" class="done"/><text x="128" y="506" class="t">complete</text><rect x="530" y="490" width="170" height="22" rx="5" class="run"/><text x="540" y="506" class="t">RUN</text><rect x="955" y="490" width="190" height="22" rx="5" class="gate"/><text x="965" y="506" class="t">DEPENDENCY GATE</text>
<text x="62" y="537" class="t">P4</text><rect x="118" y="520" width="150" height="22" rx="5" class="done"/><text x="128" y="536" class="t">complete</text><rect x="530" y="520" width="170" height="22" rx="5" class="queue"/><text x="540" y="536" class="t">QUEUE</text><rect x="955" y="520" width="190" height="22" rx="5" class="gate"/><text x="965" y="536" class="t">DEPENDENCY GATE</text>
<text x="62" y="567" class="t">P5</text><rect x="118" y="550" width="150" height="22" rx="5" class="done"/><text x="128" y="566" class="t">complete</text><rect x="530" y="550" width="170" height="22" rx="5" class="held"/><text x="540" y="566" class="t">POLICY HELD</text><rect x="955" y="550" width="190" height="22" rx="5" class="gate"/><text x="965" y="566" class="t">DEPENDENCY GATE</text>
<text x="62" y="597" class="t">P6</text><rect x="118" y="580" width="150" height="22" rx="5" class="done"/><text x="128" y="596" class="t">complete</text><rect x="530" y="580" width="170" height="22" rx="5" class="held"/><text x="540" y="596" class="t">POLICY HELD</text><rect x="955" y="580" width="190" height="22" rx="5" class="gate"/><text x="965" y="596" class="t">DEPENDENCY GATE</text></g>
<path d="M268 441H530M700 441H955M268 471H530M700 471H955M268 501H530M700 501H955M268 531H530M700 531H955M268 561H530M700 561H955M268 591H530M700 591H955" fill="none" stroke="#d0d5dd" marker-end="url(#a)"/>
<rect x="36" y="630" width="1328" height="160" rx="14" class="p"/><text x="54" y="658" class="b">Linked analytical strips · shared cursor</text><text x="54" y="702" class="s">CPU composition</text><rect x="190" y="684" width="1120" height="24" fill="url(#dots)" stroke="#d0d5dd"/><rect x="190" y="684" width="43" height="24" class="run"/><text x="54" y="738" class="s">QPU run / queue / held</text><rect x="190" y="720" width="1120" height="24" fill="#f9fafb" stroke="#d0d5dd"/><rect x="233" y="720" width="1034" height="8" fill="#e9ddf5"/><rect x="233" y="728" width="862" height="8" fill="#eee5ff"/><rect x="233" y="736" width="690" height="8" fill="#fff0d5"/><line x1="578" y1="674" x2="578" y2="754" stroke="#101828" stroke-width="2" stroke-dasharray="5 4"/><text x="578" y="771" class="t" text-anchor="middle">t=4.5 s</text><text x="1020" y="772" class="s">Cost strip disabled: no authoritative v1 cost time series.</text>
