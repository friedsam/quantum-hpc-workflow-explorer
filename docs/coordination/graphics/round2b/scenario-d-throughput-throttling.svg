<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title id="title">Scenario D throughput throttling full-system debugger prototype</title>
<desc id="desc">At time 4.5 seconds one CPU continuation and quantum 3 run, quantum 4 waits in the QPU resource queue, quantum 5 and 6 are policy-held, and five CPU units are released. Task waits are separate from resource units.</desc>
<defs><pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#eaecf0"/><circle cx="2" cy="2" r="1" fill="#667085"/></pattern><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L7 3Z" fill="#667085"/></marker></defs>
<style>text{font-family:Inter,Arial,sans-serif;fill:#18202b}.h{font-size:25px;font-weight:700}.b{font-size:15px;font-weight:650}.s{font-size:12px;fill:#667085}.t{font-size:11px;font-weight:650}.p{fill:#fff;stroke:#d0d5dd}.run{fill:#d9f2e3;stroke:#2f855a}.queue{fill:#eee5ff;stroke:#6b46c1}.held{fill:#fff0d5;stroke:#b54708;stroke-dasharray:6 4}.gate{fill:#eaf2ff;stroke:#175cd3}.done{fill:#f2f4f7;stroke:#475467}</style>
<rect width="1400" height="820" fill="#f7f8fa"/><text x="36" y="42" class="h">Scenario D · throughput / throttling</text><text x="36" y="64" class="s">Frozen-v1 debugger · selected t=4.5 s · synthetic acceptance fixture</text>
<rect x="1060" y="22" width="304" height="52" rx="12" class="p"/><text x="1078" y="43" class="s">Semantic state</text><text x="1078" y="64" class="b">q3 RUN · q4 QUEUE · q5/q6 HELD</text>
<rect x="36" y="94" width="648" height="245" rx="14" class="p"/><text x="54" y="122" class="b">Capacity plane · CPU release-aware capacity 6</text><text x="54" y="142" class="s">Exact resource units only</text>
<rect x="58" y="164" width="100" height="44" class="run"/><text x="108" y="184" class="t" text-anchor="middle">Active</text><text x="108" y="201" class="t" text-anchor="middle">1</text><rect x="158" y="164" width="502" height="44" fill="url(#dots)" stroke="#667085"/><text x="409" y="184" class="t" text-anchor="middle">Released</text><text x="409" y="201" class="t" text-anchor="middle">5</text>
<rect x="58" y="230" width="286" height="42" rx="8" class="gate"/><text x="72" y="249" class="b">Dependency-gated continuations</text><text x="328" y="260" class="b" text-anchor="end">4 tasks</text><text x="72" y="286" class="s">consumer-3 … consumer-6 · tasks, not CPU units</text>
<text x="386" y="244" class="s">Allocated idle</text><text x="646" y="246" class="b" text-anchor="end">0 units</text><text x="386" y="270" class="s">Active communication</text><text x="646" y="272" class="b" text-anchor="end">0 transfers</text><text x="386" y="300" class="s">Tasks ≠ resource units</text>
<rect x="704" y="94" width="660" height="245" rx="14" class="p"/><text x="722" y="122" class="b">Quantum service · QPU capacity 1</text><text x="722" y="142" class="s">Resource queue and admission policy are distinct</text>
<rect x="726" y="164" width="190" height="42" rx="8" class="run"/><text x="740" y="183" class="s">Running</text><text x="900" y="194" class="b" text-anchor="end">quantum-3</text><rect x="926" y="164" width="190" height="42" rx="8" class="queue"/><text x="940" y="183" class="s">Resource queue</text><text x="1100" y="194" class="b" text-anchor="end">q4 · 1 task</text><rect x="1126" y="164" width="214" height="42" rx="8" class="held"/><text x="1140" y="183" class="s">Policy held</text><text x="1324" y="194" class="b" text-anchor="end">q5/q6 · 2 tasks</text>
<rect x="726" y="230" width="614" height="58" rx="9" class="held"/><text x="740" y="251" class="b">Admission policy · derived causal explanation</text><text x="740" y="274" class="s">Two dependency-ready QPU tasks remain throttled; never convert to “2 CPU ranks”.</text><text x="1040" y="314" class="t">QPU run 1 + queue 1 = in-flight bound 2</text>
<rect x="36" y="362" width="1328" height="245" rx="14" class="p"/><text x="54" y="390" class="b">Workflow DAG lens · six independent paths · fixed geometry</text><text x="118" y="418" class="s">CPU prep</text><text x="530" y="418" class="s">QPU</text><text x="955" y="418" class="s">CPU continuation</text>
<g id="paths">
