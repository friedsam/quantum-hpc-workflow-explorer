<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc"><title id="title">Scenario B synchronization wall — full-system visual prototype</title><desc id="desc">At t=4.0 seconds the fixed CPU reservation is fully allocated-idle while quantum-b runs. The collective continuation is dependency-gated on one unresolved quantum predecessor. Resource units and causal task waits are shown separately.</desc><defs>
  <pattern id="hatch-idle" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFF2C7"/><line x1="0" y1="0" x2="0" y2="8" stroke="#B7791F" stroke-width="2" opacity="0.45"/></pattern>
  <pattern id="dots-released" patternUnits="userSpaceOnUse" width="8" height="8"><rect width="8" height="8" fill="#EAECF0"/><circle cx="2" cy="2" r="1.1" fill="#667085" opacity="0.42"/></pattern>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 z" fill="#18202B"/></marker>
</defs><style>
