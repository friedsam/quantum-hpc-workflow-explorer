  .node{font-family:Inter,Arial,sans-serif;font-size:11px;font-weight:600;fill:#18202B}
</style><rect width="1600" height="1040" fill="#F7F8FA"/><text x="48" y="52" class="h1" text-anchor="start" >Scenario B · synchronization wall</text><text x="48" y="78" class="small" text-anchor="start" >Full-system debugger prototype · frozen-v1 semantics · synthetic fixture timing</text><rect x="1060" y="30" width="492" height="62" rx="14" fill="#FFFFFF" stroke="#D0D5DD" /><text x="1080" y="54" class="small" text-anchor="start" >Selected simulation time</text><text x="1080" y="78" class="h2" text-anchor="start" >4.0 s</text><text x="1280" y="54" class="small" text-anchor="start" >Semantic step</text><text x="1280" y="78" class="mono" text-anchor="start" >quantum-a complete; quantum-b running</text><rect x="48" y="98" width="150" height="28" rx="14" fill="#F2F4F7" stroke="#475467" /><text x="123" y="117" class="tiny" text-anchor="middle" fill="#475467">ENGINE EVIDENCE</text><rect x="208" y="98" width="215" height="28" rx="14" fill="#EAF2FF" stroke="#175CD3" /><text x="315.5" y="117" class="tiny" text-anchor="middle" fill="#175CD3">PRESET SYNC WAIT</text><rect x="48" y="140" width="720" height="286" rx="14" fill="#FFFFFF" stroke="#D0D5DD" /><text x="66" y="170" class="h2" text-anchor="start" >Whole-system runtime</text><text x="66" y="190" class="small" text-anchor="start" >Capacity accounting and causal explanation are separate planes.</text><text x="76" y="208" class="h3" text-anchor="start" >CPU pool · fixed reservation 4 / capacity 4 · 4 units</text><rect x="76" y="220" width="660" height="46" rx="0" fill="url(#hatch-idle)" stroke="#B7791F" /><text x="406" y="240" class="tiny" text-anchor="middle" >Allocated idle</text><text x="406" y="256" class="tiny" text-anchor="middle" >4</text><rect x="76" y="220" width="660" height="46" rx="4" fill="none" stroke="#18202B" fill-opacity="0"/><rect x="76" y="282" width="300" height="42" rx="8" fill="#D9F2E3" stroke="#2F855A" /><text x="88" y="300" class="small" text-anchor="start" >Active classical</text><text x="364" y="308" class="h3" text-anchor="end" >0 units</text><rect x="76" y="332" width="300" height="42" rx="8" fill="url(#hatch-idle)" stroke="#B7791F" /><text x="88" y="350" class="small" text-anchor="start" >Allocated idle</text><text x="364" y="358" class="h3" text-anchor="end" >4 units</text><rect x="76" y="382" width="300" height="42" rx="8" fill="#EAECF0" stroke="#667085" /><text x="88" y="400" class="small" text-anchor="start" >Released</text><text x="364" y="408" class="h3" text-anchor="end" >0 units</text><rect x="394" y="282" width="346" height="54" rx="9" fill="#EAF2FF" stroke="#175CD3" /><text x="406" y="302" class="h3" text-anchor="start" >Collective synchronization wait</text><text x="728" y="303" class="h3" text-anchor="end" >1 task</text><text x="406" y="323" class="small" text-anchor="start" >collective-continuation · 1/2 prerequisites complete</text><rect x="394" y="344" width="346" height="54" rx="9" fill="#FEE4E2" stroke="#D92D20" /><text x="406" y="364" class="h3" text-anchor="start" >Active communication</text><text x="728" y="365" class="h3" text-anchor="end" >0</text><text x="406" y="385" class="small" text-anchor="start" >zero-cost control edges emit no transfer events</text><rect x="792" y="140" width="760" height="286" rx="14" fill="#FFFFFF" stroke="#D0D5DD" /><text x="810" y="170" class="h2" text-anchor="start" >Quantum service</text><text x="810" y="190" class="small" text-anchor="start" >Resource queue and admission/policy hold remain distinct.</text><text x="820" y="208" class="h3" text-anchor="start" >QPU pool · capacity 1 · 1 units</text><rect x="820" y="220" width="704" height="46" rx="0" fill="#D9F2E3" stroke="#2F855A" /><text x="1172" y="240" class="tiny" text-anchor="middle" >Active</text><text x="1172" y="256" class="tiny" text-anchor="middle" >1</text><rect x="820" y="220" width="704" height="46" rx="4" fill="none" stroke="#18202B" fill-opacity="0"/><rect x="820" y="282" width="330" height="42" rx="8" fill="#E9DDF5" stroke="#7A5AA6" /><text x="832" y="300" class="small" text-anchor="start" >Running</text><text x="1138" y="308" class="h3" text-anchor="end" >quantum-b</text><rect x="820" y="332" width="330" height="42" rx="8" fill="#EEE5FF" stroke="#6B46C1" /><text x="832" y="350" class="small" text-anchor="start" >Resource queue</text><text x="1138" y="358" class="h3" text-anchor="end" >0 tasks</text><rect x="820" y="382" width="330" height="42" rx="8" fill="#FFF0D5" stroke="#B54708" /><text x="832" y="400" class="small" text-anchor="start" >Policy held</text><text x="1138" y="408" class="h3" text-anchor="end" >0 tasks</text><rect x="1170" y="282" width="354" height="54" rx="9" fill="#EAF2FF" stroke="#175CD3" /><text x="1182" y="302" class="h3" text-anchor="start" >Why continuation waits</text><text x="1512" y="303" class="h3" text-anchor="end" >sync gate</text><text x="1182" y="323" class="small" text-anchor="start" >collective task is not dependency-ready yet</text><rect x="1170" y="352" width="354" height="28" rx="14" fill="#EAF2FF" stroke="#175CD3" /><text x="1347" y="371" class="tiny" text-anchor="middle" fill="#175CD3">Do not convert dependency-gated work to “blocked CPU units”</text><rect x="48" y="454" width="1504" height="190" rx="14" fill="#FFFFFF" stroke="#D0D5DD" /><text x="66" y="484" class="h2" text-anchor="start" >Workflow DAG lens</text><text x="66" y="504" class="small" text-anchor="start" >Topology remains fixed; state styling updates at selected time.</text><rect x="90" y="545" width="170" height="48" rx="8" fill="#F2F4F7" stroke="#475467" /><text x="100" y="565" class="node" text-anchor="start" >Prep A</text><text x="100" y="583" class="tiny" text-anchor="start" fill="#475467">complete</text><rect x="90" y="609" width="170" height="48" rx="8" fill="#F2F4F7" stroke="#475467" /><text x="100" y="629" class="node" text-anchor="start" >Prep B</text><text x="100" y="647" class="tiny" text-anchor="start" fill="#475467">complete</text><rect x="620" y="545" width="190" height="48" rx="8" fill="#F2F4F7" stroke="#475467" /><text x="630" y="565" class="node" text-anchor="start" >Quantum A</text><text x="630" y="583" class="tiny" text-anchor="start" fill="#475467">complete</text><rect x="620" y="609" width="190" height="48" rx="8" fill="#D9F2E3" stroke="#2F855A" /><text x="630" y="629" class="node" text-anchor="start" >Quantum B</text><text x="630" y="647" class="tiny" text-anchor="start" fill="#2F855A">RUN</text><rect x="1240" y="577" width="230" height="48" rx="8" fill="#EAF2FF" stroke="#175CD3" /><text x="1250" y="597" class="node" text-anchor="start" >Collective continue</text><text x="1250" y="615" class="tiny" text-anchor="start" fill="#175CD3">SYNC WAIT · PRESET JOIN</text><line x1="260" y1="569" x2="620" y2="569" stroke="#475467" stroke-width="2" marker-end="url(#arrow)" /><line x1="260" y1="633" x2="620" y2="633" stroke="#475467" stroke-width="2" marker-end="url(#arrow)" /><line x1="810" y1="569" x2="1240" y2="601" stroke="#475467" stroke-width="2" marker-end="url(#arrow)" /><line x1="810" y1="633" x2="1240" y2="601" stroke="#175CD3" stroke-width="3" marker-end="url(#arrow)" /><rect x="1010" y="542" width="178" height="28" rx="14" fill="#EAF2FF" stroke="#175CD3" /><text x="1099" y="561" class="tiny" text-anchor="middle" fill="#175CD3">1 / 2 prerequisites complete</text><rect x="48" y="728" width="1504" height="270" rx="14" fill="#FFFFFF" stroke="#D0D5DD" /><text x="66" y="758" class="h2" text-anchor="start" >Linked analytical strips</text><text x="66" y="778" class="small" text-anchor="start" >Cursor is shared with runtime panel and DAG; click/zoom selects an interval for slow semantic playback.</text><text x="66" y="833" class="small" text-anchor="start" >CPU composition</text><text x="66" y="889" class="small" text-anchor="start" >QPU run / queue</text><text x="66" y="945" class="small" text-anchor="start" >Cumulative cost</text><rect x="233" y="816" width="1291" height="34" rx="4" fill="#F9FAFB" stroke="#D0D5DD" /><rect x="233" y="872" width="1291" height="34" rx="4" fill="#F9FAFB" stroke="#D0D5DD" /><rect x="233" y="928" width="1291" height="34" rx="4" fill="#F9FAFB" stroke="#D0D5DD" /><rect x="233" y="816" width="184.42857142857144" height="17" rx="0" fill="#D9F2E3" stroke="#2F855A" /><rect x="233" y="833" width="184.42857142857144" height="17" rx="0" fill="url(#hatch-idle)" stroke="#B7791F" /><rect x="417.42857142857144" y="816" width="922.1428571428572" height="34" rx="0" fill="url(#hatch-idle)" stroke="#B7791F" /><rect x="1339.5714285714287" y="816" width="184.42857142857133" height="34" rx="0" fill="#D9F2E3" stroke="#2F855A" /><rect x="417.42857142857144" y="872" width="922.1428571428572" height="17" rx="0" fill="#E9DDF5" stroke="#7A5AA6" /><text x="425.42857142857144" y="885" class="axis" text-anchor="start" >QPU active</text><rect x="417.42857142857144" y="889" width="553.2857142857142" height="17" rx="0" fill="#EEE5FF" stroke="#6B46C1" /><text x="425.42857142857144" y="902" class="axis" text-anchor="start" >queue depth 1</text><text x="245" y="949" class="small" text-anchor="start" >Cost rates not configured in this synthetic fixture — strip disabled rather than showing a misleading zero curve.</text><line x1="970.7142857142857" y1="802" x2="970.7142857142857" y2="972" stroke="#101828" stroke-width="2" stroke-dasharray="5 4"/><rect x="922.7142857142857" y="788" width="96" height="28" rx="14" fill="#FFFFFF" stroke="#101828" /><text x="970.7142857142857" y="807" class="tiny" text-anchor="middle" fill="#101828">t=4.0 s</text><line x1="233" y1="965" x2="233" y2="972" stroke="#D0D5DD" stroke-width="1" /><text x="233" y="986" class="axis" text-anchor="middle" >0</text><line x1="417.42857142857144" y1="965" x2="417.42857142857144" y2="972" stroke="#D0D5DD" stroke-width="1" /><text x="417.42857142857144" y="986" class="axis" text-anchor="middle" >1</text><line x1="601.8571428571429" y1="965" x2="601.8571428571429" y2="972" stroke="#D0D5DD" stroke-width="1" /><text x="601.8571428571429" y="986" class="axis" text-anchor="middle" >2</text><line x1="786.2857142857143" y1="965" x2="786.2857142857143" y2="972" stroke="#D0D5DD" stroke-width="1" /><text x="786.2857142857143" y="986" class="axis" text-anchor="middle" >3</text><line x1="970.7142857142857" y1="965" x2="970.7142857142857" y2="972" stroke="#D0D5DD" stroke-width="1" /><text x="970.7142857142857" y="986" class="axis" text-anchor="middle" >4</text><line x1="1155.142857142857" y1="965" x2="1155.142857142857" y2="972" stroke="#D0D5DD" stroke-width="1" /><text x="1155.142857142857" y="986" class="axis" text-anchor="middle" >5</text><line x1="1339.5714285714287" y1="965" x2="1339.5714285714287" y2="972" stroke="#D0D5DD" stroke-width="1" /><text x="1339.5714285714287" y="986" class="axis" text-anchor="middle" >6</text><line x1="1524" y1="965" x2="1524" y2="972" stroke="#D0D5DD" stroke-width="1" /><text x="1524" y="986" class="axis" text-anchor="middle" >7</text></svg>